<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b33"><meta name="apple-mobile-web-app-capable" content="yes"><title>Meu Inglês</title><link rel="manifest" href="manifest.webmanifest"><style>*{box-sizing:border-box}body{margin:0;background:#0d1830;color:#f3f8ff;font:16px system-ui,-apple-system,sans-serif}main{max-width:620px;padding:24px 18px 110px;margin:auto}header{display:flex;align-items:center;justify-content:space-between}.brand{font-size:25px;font-weight:900}.brand em{font-style:normal;color:#6eebbe}.tag{border-radius:25px;background:#203c44;color:#7fefc3;padding:9px 13px;font-size:13px;font-weight:700}.hero{border-radius:24px;background:linear-gradient(140deg,#2c507e,#182543);padding:24px;margin:24px 0}.hero h1{font-size:29px;margin:8px 0}.muted{color:#b8c7df}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat,.card{background:#172744;border:1px solid #334765;border-radius:16px;padding:15px}.stat{text-align:center}.stat b{display:block;font-size:23px}.stat small{color:#adbfda}h2{font-size:20px;margin-top:25px}button{cursor:pointer;font:inherit}.primary{background:#75ebbd;border:0;color:#0b2630;padding:14px 18px;border-radius:13px;font-weight:800}.secondary{background:#2b4162;color:#ecf6ff;border:1px solid #465d7e;border-radius:13px;padding:12px}.lesson{display:flex;width:100%;align-items:center;gap:14px;text-align:left;margin:10px 0;color:#edf5ff;background:#172744;border:1px solid #334765;border-radius:16px;padding:15px}.lesson small{display:block;color:#afc1dc;margin-top:4px}.num{display:grid;place-items:center;width:42px;height:42px;flex-shrink:0;background:#2a415b;border-radius:12px;color:#82edc1;font-weight:bold}.bar{height:10px;background:#314262;border-radius:9px;overflow:hidden}.bar span{display:block;background:#75ebbd;height:100%}.option{width:100%;padding:15px;text-align:left;margin:7px 0;background:#213757;border:1px solid #4c5d78;border-radius:13px;color:white}.correct{border-color:#75ebbd;background:#20554a}.wrong{border-color:#f28f9b;background:#592d3f}.phrase{font-size:26px;font-weight:800;margin:22px 0 16px}.small{font-size:13px}.nav{position:fixed;bottom:0;left:0;right:0;background:#101d35;border-top:1px solid #324663;padding-bottom:env(safe-area-inset-bottom);display:flex;justify-content:center}.nav button{flex:1;max-width:200px;padding:18px 3px;background:none;color:#b7c7db;border:0;font-weight:700}.nav button.active{color:#75ebbd}</style></head><body><main><header><div class="brand">meu<em>inglês</em> 📗</div><div class="tag">Nível A1</div></header><div id="screen"></div></main><nav class="nav"><button id="nav-home" onclick="show('home')">⌂ Início</button><button id="nav-lessons" onclick="show('lessons')">▤ Aulas</button><button id="nav-review" onclick="show('review')">◈ Revisão</button></nav><script>
const lessons=[
["Apresentações","Seu nome, sua cidade e cumprimentos",[["What is your name?","Qual é o seu nome?",["Que horas são?","Qual é o seu nome?","Onde você mora?"],1],["I'm from Brazil.","Eu sou do Brasil.",["Sou do Brasil.","Eu estou bem.","Sou professor."],0],["Nice to meet you!","Prazer em conhecer você!",["Boa viagem!","Até amanhã!","Prazer em conhecer você!"],2]]],
["Aeroporto","Passaporte, embarque e bagagem",[["Where is the gate?","Onde fica o portão?",["Onde fica o portão?","Onde é meu hotel?","Qual é o preço?"],0],["Here is my passport.","Aqui está meu passaporte.",["Tenho duas malas.","Aqui está meu passaporte.","Meu voo atrasou."],1],["I have one bag.","Tenho uma mala.",["Quero água.","Tenho um bilhete.","Tenho uma mala."],2]]],
["Hotel","Reservas, recepção e pedidos",[["I have a reservation.","Tenho uma reserva.",["Tenho uma reserva.","Estou atrasado.","Quero pagar."],0],["What time is check-out?","Que horas é o check-out?",["Onde é a saída?","Que horas é o check-out?","Posso estacionar?"],1],["Can I have the key?","Posso pegar a chave?",["Preciso de ajuda.","Onde está a chave?","Posso pegar a chave?"],2]]],
["Restaurante","Cardápio, pedidos e pagamento",[["Can I see the menu?","Posso ver o cardápio?",["Posso ver o cardápio?","Tem banheiro?","Você aceita cartão?"],0],["The bill, please.","A conta, por favor.",["Mais água, por favor.","A conta, por favor.","Sem gelo, por favor."],1],["Water, please.","Água, por favor.",["Um café.","Água, por favor.","Um refrigerante."],1]]],
["Compras","Preços, tamanhos e cartões",[["How much is this?","Quanto custa isto?",["Que tamanho é este?","Tem outra cor?","Quanto custa isto?"],2],["Do you have a larger size?","Tem tamanho maior?",["Tem tamanho maior?","Tem desconto?","Aceita cartão?"],0],["Can I pay by card?","Posso pagar com cartão?",["Pode entregar?","Posso pagar com cartão?","Pode trocar?"],1]]],
["Trabalho","Conversas básicas de negócios",[["I own a business.","Tenho uma empresa.",["Estou viajando.","Tenho uma empresa.","Preciso estudar."],1],["Let's have a meeting.","Vamos fazer uma reunião.",["Vamos almoçar.","Vamos viajar.","Vamos fazer uma reunião."],2],["I need more information.","Preciso de mais informações.",["Preciso de mais informações.","Preciso de mais dinheiro.","Preciso de ajuda."],0]]]
];
const key="meu-ingles-progress-v1";let state;try{state=JSON.parse(localStorage.getItem(key))}catch(e){}if(!state||!Array.isArray(state.done))state={done:[],points:0};let page="home",unit=0,step=0,locked=false;const el=document.getElementById("screen");function save(){localStorage.setItem(key,JSON.stringify(state))}function say(t){if(!window.speechSynthesis){alert("Áudio indisponível neste navegador");return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.8;speechSynthesis.speak(u)}function show(v){page=v;render()}function start(i){unit=i;step=0;locked=false;page="quiz";render()}function choose(i){if(locked)return;locked=true;let q=lessons[unit][2][step],correct=i===q[3];if(correct){state.points+=10;save()}document.querySelectorAll(".option").forEach((b,j)=>{b.disabled=true;if(j===q[3])b.classList.add("correct");else if(j===i)b.classList.add("wrong")});document.getElementById("feedback").innerHTML="<p>"+(correct?"✅ Correto!":"❌ Correto: "+q[2][q[3]])+"</p><button class='primary' onclick='next()'>Continuar →</button>"}function next(){step++;locked=false;if(step>=3){if(!state.done.includes(unit)){state.done.push(unit);state.points+=20;save()}page="finish"}render()}function listing(){return lessons.map((l,i)=>'<button class="lesson" onclick="start('+i+')"><span class="num">'+(state.done.includes(i)?"✓":i+1)+'</span><span><b>'+l[0]+'</b><small>'+l[1]+'</small></span></button>').join("")}function render(){document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));let tab=["home","lessons","review"].includes(page)?page:"lessons";document.getElementById("nav-"+tab).classList.add("active");if(page==="home"){let pending=lessons.findIndex((l,i)=>!state.done.includes(i));if(pending<0)pending=0;el.innerHTML='<div class="hero"><span class="small">Seu curso personalizado</span><h1>Hi, Thiago! 👋</h1><p class="muted">Pratique inglês por 30 minutos por dia, no seu ritmo.</p><button class="primary" onclick="start('+pending+')">▶ Começar a estudar</button></div><div class="stats"><div class="stat"><b>'+state.done.length+'/6</b><small>Aulas</small></div><div class="stat"><b>'+state.points+'</b><small>Pontos</small></div><div class="stat"><b>'+Math.round(state.done.length/6*100)+'%</b><small>Progresso</small></div></div><h2>Seu progresso</h2><div class="bar"><span style="width:'+state.done.length/6*100+'%"></span></div><h2>Atividades</h2>'+listing()}if(page==="lessons")el.innerHTML='<h2>Suas aulas</h2><p class="muted">Escolha uma aula para praticar. Você pode repetir qualquer exercício.</p>'+listing();if(page==="quiz"){let q=lessons[unit][2][step];el.innerHTML='<p class="muted">Aula '+(unit+1)+' — '+lessons[unit][0]+' • '+(step+1)+' de 3</p><div class="bar"><span style="width:'+(step/3*100)+'%"></span></div><div class="phrase">'+q[0]+'</div><button class="secondary" onclick="say(lessons[unit][2][step][0])">🔊 Ouvir em inglês</button><p class="muted">Qual é a tradução correta?</p>'+q[2].map((o,i)=>'<button class="option" onclick="choose('+i+')">'+o+'</button>').join("")+'<div id="feedback"></div>'}if(page==="finish")el.innerHTML='<section class="hero"><h1>Parabéns! 🎉</h1><p>Você terminou a aula '+(unit+1)+': '+lessons[unit][0]+'</p><button class="primary" onclick="show(\'lessons\')">Voltar às aulas</button></section>';if(page==="review"){el.innerHTML='<h2>Revisão de frases</h2><p class="muted">Escute e repita cada frase em voz alta.</p>'+lessons.flatMap(l=>l[2]).map((q,i)=>'<div class="card" style="margin:10px 0"><b>'+q[0]+'</b><p class="muted">'+q[1]+'</p><button class="secondary" onclick="say(lessons['+Math.floor(i/3)+'][2]['+(i%3)+'][0])">🔊 Ouvir</button></div>').join("")}}if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});render();
</script></body></html>
